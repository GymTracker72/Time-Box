.row.olrow{flex-wrap:wrap;gap:6px;min-height:0;padding:7px 0}.row.olrow .t{flex:1 1 100%;min-width:0;font-size:15px}h2.warn-t{font-size:15px}.row.olrow .mini{flex:1 1 0;min-width:0;padding:6px 4px;font-size:12px;line-height:1.15;align-self:auto;min-height:0}

.wch .tp{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.35;min-width:0}.wch .tp i{flex:none;width:7px;height:7px;border-radius:50%}.wch .tp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.wch .tp.dn2 span{text-decoration:line-through;opacity:.55}.wch .tp.em{color:var(--muted);font-style:italic}.wch .tp svg{width:14px;height:11px;flex:none}

.wcb.dn{opacity:.55}.wcb.dn .tt{text-decoration:line-through}
.wcb .tm{display:block;font-weight:400;font-size:10px;opacity:.85}.wcb .fr2{position:absolute;right:2px;top:2px;display:inline-flex;background:var(--surface);border-radius:3px;padding:1px 2px}.wcb .fr2 svg{width:14px;height:11px}
.wcb{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wcb.hascb{padding-left:21px}.wcb .cb{position:absolute;left:3px;top:3px;width:14px;height:14px;border-color:currentColor}

.wcb .rz{position:absolute;left:0;right:0;bottom:0;height:min(10px,40%);cursor:ns-resize;touch-action:none;z-index:2}
.wcb .rz::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.4}
.wcb.dragging{box-shadow:0 5px 16px rgba(0,0,0,.38);z-index:10;opacity:.93;cursor:grabbing}
.wcc{cursor:cell}.wcb{cursor:grab}
.wcn{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:4;pointer-events:none}
.hrs.blk2{justify-content:flex-start;padding:2px 0 8px}

/* ---- orario ---- */
function overlap(a,b){return a.s<b.s+b.n&&b.s<a.s+a.n}
function conflicts(d){
  var out=[],bl=d.blocks;
  for(var i=0;i<bl.length;i++)for(var j=i+1;j<bl.length;j++)if(overlap(bl[i],bl[j]))out.push([bl[i],bl[j]]);
  return out;
}
function layout(bl){
  var s=bl.slice().sort(function(a,b){return a.s-b.s||b.n-a.n}),res={},cl=[],end=-1;
  s.forEach(function(b){
    if(cl.length&&b.s>=end){fin(cl);cl=[];end=-1}
    cl.push(b);end=Math.max(end,b.s+b.n);
  });
  if(cl.length)fin(cl);
  function fin(c){
    var cols=[];
    c.forEach(function(b){
      var k=0;while(cols[k]&&cols[k]>b.s)k++;
      cols[k]=b.s+b.n;res[b.id]={c:k};
    });
    c.forEach(function(b){res[b.id].n=cols.length});
  }
  return res;
}

  return {free:Math.max(st.hours*60-fixed,0),plan:plan,tot:fixed+plan,left:Math.max(st.hours*60-fixed-plan,0),conf:conflicts(d).length};
}

function pr(i){return i.pr||''}

function sameTitle(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
function itemUsedElsewhere(id,exceptBlock){
  var n=0;Object.keys(st.days).forEach(function(k){var dy=st.days[k];if(!dy)return;
    (dy.blocks||[]).forEach(function(b){if(b!==exceptBlock&&b.ref===id)n++});

}
/* un blocco con lo stesso titolo della Top del giorno è la Top: stessa voce, stessa spunta */
function linkTopBlocks(){
  Object.keys(st.days).forEach(function(k){var dy=st.days[k];if(!dy||!dy.tops||!dy.blocks)return;
    AK.forEach(function(a){var tid=dy.tops[a];if(!tid||tid==='empty')return;var T=item(tid);if(!T)return;

      if(!b)return;
      var D=b.ref&&item(b.ref);
      if(D){

        if(itemUsedElsewhere(D.id,b))return;
        if(D.st&&!T.st)T.st=D.st;
        st.dump=st.dump.filter(function(x){return x!==D});
        dy.prog=(dy.prog||[]).filter(function(x){return x!==D.id});

/* ---- ricorrenze ---- */
var REPS=[['','Mai'],['d','Ogni giorno'],['wd','Giorni feriali (lun–ven)'],['w','Ogni settimana'],['w2','Ogni 2 settimane'],['m','Ogni mese'],['y','Ogni anno'],['c','Personalizzata…']];
function repName(k){for(var i=0;i<REPS.length;i++)if(REPS[i][0]===k)return REPS[i][1].toLowerCase();return ''}
var WDN=['dom','lun','mar','mer','gio','ven','sab'],WDL=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],WDO=[1,2,3,4,5,6,0];
function nthOf(iso){var d=parse(iso),n=Math.ceil(d.getDate()/7),ld=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return (d.getDate()+7>ld)&&n>=4?-1:n}
function specOf(sh){
  if(sh.rep!=='c')return {rep:sh.rep||''};
  return {rep:'c',fq:sh.rfq||'w',iv:Math.max(1,Math.floor(+sh.riv)||1),wd:(sh.rwd||[]).map(Number).sort(function(a,b){return a-b}),mm:sh.rmm||'dom'};
}
function repLabel(sp,date){
  if(!sp||!sp.rep)return '';

  if(sp.fq==='w'&&sp.wd&&sp.wd.length)t+=' il '+WDO.filter(function(x){return sp.wd.indexOf(x)>=0}).map(function(x){return WDN[x]}).join(', ');
  if(sp.fq==='m'){t+=sp.mm==='nth'&&date?' il '+(nthOf(date)<0?'ultimo ':nthOf(date)+'° ')+WDL[parse(date).getDay()]:date?' il giorno '+parse(date).getDate():''}
  return t;
}
function genC(r,from,to){
  var out=[],e=r.end||{t:'n'},iv=Math.max(1,r.iv||1),sd=parse(r.start),cnt=0,sdom=sd.getDate(),sdw=sd.getDay(),p,k;
  for(p=0;p<6000;p++){
    var c=[],first;
    if(r.fq==='d')c=[addDays(r.start,iv*p)];
    else if(r.fq==='w'){var mon=addDays(r.start,-((sdw+6)%7)),wk=addDays(mon,7*iv*p);first=wk;WDO.forEach(function(w){if((r.wd||[]).indexOf(w)>=0)c.push(addDays(wk,(w+6)%7))})}
    else if(r.fq==='m'){
      var y=sd.getFullYear(),m=sd.getMonth()+iv*p,ld=new Date(y,m+1,0).getDate();
      if(r.mm==='nth'){var nn=nthOf(r.start),dd;
        if(nn<0){dd=ld;while(new Date(y,m,dd).getDay()!==sdw)dd--}
        else{dd=1;while(new Date(y,m,dd).getDay()!==sdw)dd++;dd+=7*(nn-1)}
        c=[isoOf(new Date(y,m,dd))]}
      else c=[isoOf(new Date(y,m,Math.min(sdom,ld)))]}
    else{var y2=sd.getFullYear()+iv*p,m2=sd.getMonth(),ld2=new Date(y2,m2+1,0).getDate();c=[isoOf(new Date(y2,m2,Math.min(sdom,ld2)))]}
    if(!c.length&&r.fq==='w')return out;
    if((first||c[0])>to)break;
    for(k=0;k<c.length;k++){
      var d=c[k];if(d<r.start)continue;
      if(d>to)return out;
      if(e.t==='d'&&d>e.d)return out;
      cnt++;if(e.t==='c'&&cnt>e.c)return out;
      if(d>=from)out.push(d)}
  }
  return out;
}
function repInit(sh){
  if(sh.rep!=='c')return;
  if(!sh.rfq)sh.rfq='w';if(!sh.riv)sh.riv=1;if(!sh.rmm)sh.rmm='dom';
  if(sh.rfq==='w'&&(!sh.rwd||!sh.rwd.length))sh.rwd=[parse(sh.date||isoOf(new Date())).getDay()];
}
function mkSer(id,sh,start,end,t){var o={id:id,rep:sh.rep,start:start,end:end,t:t,upto:''},sp=specOf(sh);if(sp.rep==='c'){o.fq=sp.fq;o.iv=sp.iv;o.wd=sp.wd;o.mm=sp.mm}return o}
function recNth(r,k,prev){
  var sd=parse(r.start);
  if(r.rep==='d')return addDays(r.start,k);
  if(r.rep==='w')return addDays(r.start,7*k);
  if(r.rep==='w2')return addDays(r.start,14*k);
  if(r.rep==='wd'){if(k===0)return r.start;var c=prev;do{c=addDays(c,1)}while(parse(c).getDay()%6===0);return c}
  if(r.rep==='m'){var y=sd.getFullYear(),m=sd.getMonth()+k,ld=new Date(y,m+1,0).getDate();return isoOf(new Date(y,m,Math.min(sd.getDate(),ld)))}
  var y2=sd.getFullYear()+k,m2=sd.getMonth(),ld2=new Date(y2,m2+1,0).getDate();return isoOf(new Date(y2,m2,Math.min(sd.getDate(),ld2)));
}
function occDates(r,from,to){
  if(r.rep==='c')return genC(r,from,to);
  var out=[],prev=null,k=0,e=r.end||{t:'n'};
  while(k<6000){
    var d=recNth(r,k,prev);prev=d;
    if(d>to)break;
    if(e.t==='d'&&d>e.d)break;
    if(e.t==='c'&&k>=e.c)break;
    if(d>=from)out.push(d);
    k++}
  return out;
}
function repEnd(sh){var t=sh.rend||'n';if(t==='d')return {t:'d',d:sh.rdate||addDays(sh.date,28)};if(t==='c')return {t:'c',c:Math.floor(+sh.rcount||10)};return {t:'n'}}

  if(sh.rep==='c'){var sp=specOf(sh);if(!(+sh.riv>=1&&+sh.riv<=99)&&sh.riv!==undefined)return 'Ogni quanti: da 1 a 99.';if(sp.fq==='w'&&!sp.wd.length)return 'Scegli almeno un giorno della settimana.'}
  var e=repEnd(sh);
  if(e.t==='d'&&e.d<sh.date)return 'La data di fine è precedente all\'inizio.';

}
function repHtml(sh){
  var o=REPS.map(function(r){return '<option value="'+r[0]+'"'+((sh.rep||'')===r[0]?' selected':'')+'>'+r[1]+'</option>'}).join('');
  var h='<label><span class="lbl">Ripeti</span><select data-chg="sheet" data-f="rep">'+o+'</select></label>';
  if(sh.rep==='c'){
    var sp=specOf(sh),fo=[['d','giorni'],['w','settimane'],['m','mesi'],['y','anni']].map(function(x){return '<option value="'+x[0]+'"'+(sp.fq===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('');

function fitBlocks(){
  var els=document.querySelectorAll('#sched .blk');
  [].forEach.call(els,function(el){
    var sm=el.querySelector('.sm'),x=el.querySelector('.x'),fixed=el.classList.contains('fixed');
    el.style.fontSize='';el.style.paddingLeft='';el.style.paddingRight='';el.style.paddingTop='';el.style.paddingBottom='';el.style.lineHeight='';
    if(sm){sm.style.display='';sm.style.fontSize=''}
    if(x)x.style.padding='';
    if(!el.clientWidth)return;
    if(el.clientWidth<210){el.style.paddingLeft=fixed?'5px':'30px';el.style.paddingRight='20px';if(x)x.style.padding='4px 5px'}
    el.style.paddingTop='1px';el.style.paddingBottom='1px';el.style.lineHeight='1.12';
    function over(){return el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1}
    function set(fs){el.style.fontSize=fs+'px';if(sm)sm.style.fontSize=(fs*0.8)+'px'}
    function best(){var lo=8,hi=17,ok=false;set(lo);if(over())return false;for(var k=0;k<7;k++){var mid=(lo+hi)/2;set(mid);if(over())hi=mid;else{lo=mid;ok=true}}set(lo);return true}
    if(!best()&&sm){sm.style.display='none';best()}
  });
}

function closeReasons(d,s){
  var r=[];
  d.deleg.forEach(function(x){if(!(x.who||'').trim()){var it=item(x.id);r.push('Delega senza destinatario: «'+(it?it.text:'')+'»')}});
  if(s.conf)r.push(s.conf+(s.conf===1?' sovrapposizione aperta':' sovrapposizioni aperte')+' nell\'orario');
  if(s.plan>s.free)r.push('giornata sovraccarica');
  AK.forEach(function(a){if(!d.tops[a])r.push('Top '+AREAS[a]+' da scegliere o confermare vuota')});
  var fr=AK.some(function(a){return d.tops[a]&&d.tops[a]!=='empty'});

function removeFromDay(d,id){
  AK.forEach(function(a){if(d.tops[a]===id){d.tops[a]=null;if(d.frog===a)d.frog=null}});
  d.blocks=d.blocks.filter(function(b){return b.ref!==id});
  d.prog=d.prog.filter(function(x){return x!==id});
  d.deleg=d.deleg.filter(function(x){return x.id!==id});
}
function release(id){var d=day(),i=item(id);removeFromDay(d,id);if(i)i.status='open'}
function routeTo(id,where,extra){
  var d=day(),i=item(id);if(!i)return;
  removeFromDay(d,id);
  if(where==='prog'){i.status='prog';d.prog.push(id)}
  if(where==='deleg'){i.status='deleg';d.deleg.push({id:id,who:(extra&&extra.who)||'',due:(extra&&extra.due)||i.due||'',wait:!!(extra&&extra.wait)})}
  if(where==='drop'){i.status='discard';i.pr='E'}
}
function setTop(a,id,date){
  var d=day(date),i=item(id);if(!i)return;
  var old=d.tops[a];if(old&&old!=='empty'){var o=item(old);if(o)o.status='open'}
  d.prog=d.prog.filter(function(x){return x!==id});
  i.status='top';d.tops[a]=id;
}
/* voce già in calendario che diventa A: se la Top dell'area quel giorno è libera, la prende */
function autoTop(i){

    if(bl&&bl.some(function(b){return b.ref===i.id})){var d=st.days[k],cu=d.tops&&d.tops[i.area];if(!cu||cu==='empty'){setTop(i.area,i.id,k)}return}}

function makeFrog(a){

function curSlot(){var t=new Date(),m=t.getHours()*60+t.getMinutes();if(st.date!==isoOf(t))return 18;return Math.max(0,Math.min(NSLOT-1,Math.floor((m-S0)/30)))}

function pasteAt(date,k){
  var c=ui.clip;if(!c)return;
  var d=day(date),n=c.n;if(k+n>NSLOT)k=NSLOT-n;if(k<0)k=0;

  else{

function clipBar(){

function placeSlots(d,n,pref){
  var tries=[pref],k;for(k=pref+1;k<=NSLOT-n;k++)tries.push(k);for(k=0;k<pref;k++)tries.push(k);
  for(var t=0;t<tries.length;t++){
    var s=tries[t];if(s+n>NSLOT)continue;
    var c={s:s,n:n};
    if(!d.blocks.some(function(b){return overlap(b,c)}))return s;
  }
  return -1;
}

  var nb={id:uid(),s:s,n:n,title:title,area:area,kind:kind,ref:src?src.id:'',st:''};
  var hit=d.blocks.filter(function(b){return overlap(b,nb)});
  if(!src&&kind==='flex'){
    var ni={id:uid(),text:title,area:area||'',pr:'',due:'',status:'open',st:'',slips:0,c:Date.now()};
    st.dump.push(ni);var er2=scheduleItem(ni,st.date,s,n,'flex');

function doExit(k,i){

}

/* ---- trascinare una voce del Brain Dump sullo schedule ---- */
(function(){
  var dd=null,sup=0,lastY=0,lastX=0,raf=0,mk=null;
  document.addEventListener('click',function(e){if(Date.now()-sup<450){e.stopPropagation();e.preventDefault()}},true);
  function slotAt(y,x){
    var z=document.getElementById('sched');if(!z||z.offsetParent===null)return -1;
    var r=z.getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)return -1;
    var row=z.querySelector('.srow'),rh=row?row.offsetHeight:22,k=Math.floor((y-r.top)/rh);
    return Math.max(0,Math.min(NSLOT-2,k-(k>0?0:0)));
  }
  function mark(k){
    var z=document.getElementById('sched');if(!z)return;
    if(!mk||!mk.parentNode){mk=document.createElement('div');mk.className='dmark';z.appendChild(mk)}
    if(k<0){mk.style.display='none';return}
    var row=z.querySelector('.srow'),rh=row?row.offsetHeight:22;
    mk.style.display='';mk.style.top=(k*rh)+'px';mk.style.height=(2*rh)+'px';
    mk.textContent=slotLab(k)+'–'+slotLab(k+2);
  }
  function begin(){
    if(!dd||dd.on)return;dd.on=true;
    var g=document.createElement('div');g.className='dgh';g.textContent=dd.text;document.body.appendChild(g);dd.g=g;
    dd.el.classList.add('dragging');document.body.classList.add('ddrag');
    try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
    place();loop();
  }
  function place(){if(!dd||!dd.g)return;dd.g.style.left=(lastX+12)+'px';dd.g.style.top=(lastY-18)+'px';mark(slotAt(lastY,lastX))}
  function loop(){
    if(!dd||!dd.on)return;
    var h=window.innerHeight,dy=0;
    if(lastY<90)dy=-Math.ceil((90-lastY)/6);else if(lastY>h-90)dy=Math.ceil((lastY-(h-90))/6);
    if(dy){window.scrollBy(0,dy);place()}
    raf=requestAnimationFrame(loop);
  }
  function stop(){
    cancelAnimationFrame(raf);
    if(dd){clearTimeout(dd.timer);if(dd.g&&dd.g.parentNode)dd.g.parentNode.removeChild(dd.g);dd.el&&dd.el.classList.remove('dragging')}
    if(mk&&mk.parentNode)mk.parentNode.removeChild(mk);mk=null;
    document.body.classList.remove('ddrag');
  }
  document.addEventListener('pointerdown',function(e){
    if(ui.mode!=='plan'||ui.sel.on||ui.sheet)return;
    var el=e.target.closest&&e.target.closest('#dump .sw .it');if(!el||e.target.closest('.dcb,.swdel'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var id=el.getAttribute('data-id'),it=item(id);if(!it)return;
    lastX=e.clientX;lastY=e.clientY;
    dd={el:el,id:id,text:it.text,x0:e.clientX,y0:e.clientY,on:false,touch:e.pointerType!=='mouse',timer:0};
    if(dd.touch)dd.timer=setTimeout(begin,380);
  },true);
  document.addEventListener('pointermove',function(e){
    if(!dd)return;lastX=e.clientX;lastY=e.clientY;
    if(!dd.on){
      var d=Math.max(Math.abs(e.clientX-dd.x0),Math.abs(e.clientY-dd.y0));
      if(dd.touch){if(d>9){clearTimeout(dd.timer);dd=null}return}
      if(d>6)begin();else return;
    }
    place();
  },true);
  document.addEventListener('touchmove',function(e){if(dd&&dd.on)e.preventDefault()},{passive:false});
  function end(e){
    if(!dd)return;var x=dd;
    if(!x.on){clearTimeout(x.timer);dd=null;return}
    var k=e.type==='pointercancel'?-1:slotAt(e.clientY,e.clientX);
    stop();dd=null;sup=Date.now();
    if(k<0){render();return}
    var it=item(x.id);if(!it){render();return}
    var err=scheduleItem(it,st.date,k,2,'flex');
    if(err){ui.sheet={mode:'new',date:st.date,s:k,n:2,kind:'flex',title:'',area:'',pr:'',src:it.id,rep:'',rend:'n',rdate:'',rcount:10,err:err}}
    else toast('«'+it.text+'» alle '+slotLab(k)+', 1 h');
    render();
  }
  document.addEventListener('pointerup',end,true);
  document.addEventListener('pointercancel',end,true);
})();

var rnw={busy:0,fail:0,cl:null,cb:null,eb:null};
function bothAsk(){return new Promise(function(res,rej){
  if(!rnw.cl)rnw.cl=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:GSCOPE+' '+CSCOPE,callback:function(r){rnw.cb&&rnw.cb(r)},error_callback:function(e){rnw.eb&&rnw.eb(e)}});

  rnw.eb=function(e){rej({code:'auth',message:e&&e.type==='popup_closed'?'accesso annullato.':'accesso non riuscito.'})};

var QUOTES=[["Al mattino, quando ti costa alzarti, tieni presente questo pensiero: mi alzo per compiere il lavoro di un uomo.", "Marco Aurelio", "Meditazioni, V, 1"], ["Ciò che ostacola l'azione fa avanzare l'azione. Ciò che sta sulla strada diventa la strada.", "Marco Aurelio", "Meditazioni, V, 20"], ["Non agire come se dovessi vivere diecimila anni. La necessità incombe: finché vivi, finché puoi, diventa buono.", "Marco Aurelio", "Meditazioni, IV, 17"], ["Non è che abbiamo poco tempo: ne perdiamo molto.", "Seneca", "Sulla brevità della vita, 1, 3"], ["Mentre si rimanda, la vita passa.", "Seneca", "Lettere a Lucilio, 1, 3"], ["Per chi non sa a quale porto dirigersi, nessun vento è favorevole.", "Seneca", "Lettere a Lucilio, 71, 3"], ["Non è perché le cose sono difficili che non osiamo: è perché non osiamo che sono difficili.", "Seneca", "Lettere a Lucilio, 104, 26"], ["Nulla mi pare più infelice di chi non ha mai incontrato un'avversità.", "Seneca", "La provvidenza, 3, 3"], ["Non sono le cose a turbare gli uomini, ma i giudizi che essi formano sulle cose.", "Epitteto", "Manuale, 5"], ["Di' prima a te stesso che cosa vuoi essere, poi fa' ciò che devi fare.", "Epitteto", "Discorsi, III, 23"], ["Chi ha cominciato ha già fatto metà dell'opera.", "Orazio", "Epistole, I, 2, 40"], ["Cogli il giorno, fidandoti il meno possibile del domani.", "Orazio", "Odi, I, 11"], ["Nessun giorno senza una linea.", "Plinio il Vecchio", "Storia naturale, XXXV, 84"], ["La fortuna aiuta gli audaci.", "Virgilio", "Eneide, X, 284"], ["Fatti non foste a viver come bruti, ma per seguir virtute e canoscenza.", "Dante Alighieri", "Inferno, XXVI, 119-120"], ["Che seggendo in piuma, in fama non si vien, né sotto coltre.", "Dante Alighieri", "Inferno, XXIV, 47-48"], ["Qual è il tuo dovere? L'esigenza del giorno.", "Johann Wolfgang Goethe", "Massime e riflessioni"], ["Se ami la vita, non sprecare il tempo, perché di tempo è fatta la vita.", "Benjamin Franklin", "Poor Richard's Almanack"], ["Un oggi vale due domani.", "Benjamin Franklin", "Poor Richard's Almanack"], ["Una sola rondine non fa primavera, e neppure un solo giorno.", "Aristotele", "Etica Nicomachea, I, 7"], ["Un viaggio di mille miglia comincia da un passo.", "Lao Tzu", "Tao Te Ching, 64"], ["La mente non è un vaso da riempire, ma un fuoco da accendere.", "Plutarco", "Sull'ascolto, 48"]];
function quoteOfDay(iso){var p=iso.split('-'),n=Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);return QUOTES[n%QUOTES.length]}

/* scorrimento orizzontale in Oggi: sinistra = giorno dopo, destra = giorno prima */
(function(){var x0=0,y0=0,xl=0,yl=0,t0=0,ok=false,drag=false,el=null;
  function reset(){if(el){el.style.transition='transform .18s,opacity .18s';el.style.transform='';el.style.opacity=''}drag=false}
  function start(e){
    ok=false;drag=false;if(!{oggi:1,plan:1,sett:1,mese:1,anno:1}[ui.mode]||ui.sheet||document.getElementById('quote')||e.touches.length!==1)return;
    var tg=e.target;if(tg.closest&&tg.closest('.swit,.swdel,.blk,.wcb,.sw,input,textarea,select,#sheet,#toast,#clipbar'))return;
    var p=e.touches[0];
    el=document.getElementById(ui.mode==='plan'?'plancols':ui.mode);x0=xl=p.clientX;y0=yl=p.clientY;t0=Date.now();ok=true}
  function move(e){

    if(drag&&el){el.style.transform='translateX('+Math.max(-90,Math.min(90,dx*.45))+'px)';el.style.opacity=String(1-Math.min(.35,Math.abs(dx)/500))}}
  function end(e){

    var p=(e.changedTouches&&e.changedTouches[0])||{clientX:xl,clientY:yl};
    var dx=p.clientX-x0,dy=p.clientY-y0;reset();
    var dt0=Math.max(1,Date.now()-t0),flick=Math.abs(dx)>=28&&Math.abs(dx)/dt0>0.35;
    if(dt0>1500||(Math.abs(dx)<40&&!flick)||Math.abs(dx)<Math.abs(dy)*1.1)return;

    else{st.date=addDays(st.date,sg);if(md==='oggi')ui.oggiNav=st.date!==isoOf(new Date())?1:0;var dt=parse(st.date);msg=DOW[dt.getDay()]+' '+dt.getDate()+' '+MON[dt.getMonth()]+(st.date===isoOf(new Date())?' (oggi)':'')}

/* scorrimento a sinistra per cancellare (lista rapida in Oggi) */
(function(){var x0=0,y0=0,row=null,moved=false,blockUntil=0;
  document.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('.swdel')){row=null;return}var t=e.target.closest&&e.target.closest('.swit');if(!t){document.querySelectorAll('.sw.open').forEach(function(r){r.classList.remove('open')});row=null;return}
    var p=e.touches[0];x0=p.clientX;y0=p.clientY;row=t.parentNode;moved=false},{passive:true});
  document.addEventListener('touchmove',function(e){if(!row)return;var p=e.touches[0],dx=p.clientX-x0,dy=p.clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>24){moved=true;if(dx<0)row.classList.add('open');else row.classList.remove('open')}},{passive:true});
  document.addEventListener('touchend',function(){if(moved)blockUntil=Date.now()+400;row=null},{passive:true});

})();
})();
