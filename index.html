<style>
/* Layout: due colonne come il foglio stampato (Top, rana, liste a sinistra; orario e Svuota la mente a destra); su telefono una colonna sola. */
:root{
  --bg:#f3f5f5; --surface:#ffffff; --ink:#1f2a28; --muted:#5c6366; --line:#1f2a28; --soft:#d3dad8; --soft2:#eef1f1;
  --grey:#5c6366; --blue:#2f6188; --green:#2e6a3d; --red:#c0443c; --amber:#b45309; --amber-bg:#fdf3e6;
  --head:'Archivo','Arial Black',sans-serif; --body:'Hind','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121617; --surface:#1b2122; --ink:#e6ebeb; --muted:#9aa4a6; --line:#6d7779; --soft:#394143; --soft2:#232a2b;
  --grey:#8b9496; --blue:#5b9bd0; --green:#5fae74; --red:#e07a72; --amber:#e8a03a; --amber-bg:#2c2415; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121617; --surface:#1b2122; --ink:#e6ebeb; --muted:#9aa4a6; --line:#6d7779; --soft:#394143; --soft2:#232a2b;
  --grey:#8b9496; --blue:#5b9bd0; --green:#5fae74; --red:#e07a72; --amber:#e8a03a; --amber-bg:#2c2415; color-scheme:dark;}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.35 var(--body);padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:none;margin:0;width:100%;display:flex;flex-direction:column;gap:14px}
h1{font:900 38px/.95 var(--head);color:var(--grey);margin:0;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.card{background:var(--surface);border:1.2px solid var(--line);}
#delegcard h2{font-weight:800;color:var(--ink)}
#deleg .t{font-weight:700}
.card h2{font:600 15px/1 var(--body);color:var(--grey);text-align:center;margin:0 12px;padding:10px 0 7px;border-bottom:1px solid var(--line)}
.card .in{padding:6px 12px 12px}
.lbl{font:600 9px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.datebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;flex:1;min-width:260px}
.hrs{flex:0 0 100%;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;padding:6px 0 2px;font:500 13px/1.2 var(--body);color:var(--muted)}
.hrs span{white-space:nowrap}.hrs b{font-weight:800;color:var(--fg);font-size:15px}.hrs i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.row.olrow{flex-wrap:wrap;gap:6px;min-height:0;padding:7px 0}.row.olrow .t{flex:1 1 100%;min-width:0;font-size:15px}h2.warn-t{font-size:15px}.row.olrow .mini{flex:1 1 0;min-width:0;padding:6px 4px;font-size:12px;line-height:1.15;align-self:auto;min-height:0}
@media (min-width:700px){.row.olrow{flex-wrap:nowrap;align-items:center;gap:6px}.row.olrow .t{flex:1 1 auto}.row.olrow .mini{flex:0 0 auto;width:auto;min-height:30px;padding:0 12px;font-size:12px}}
@media (max-width:430px){.hrs{gap:4px 10px;font-size:12px}.hrs b{font-size:14px}.hrs i{margin-right:4px;width:8px;height:8px}}
.wseg{display:flex;gap:0;align-self:flex-start}.wseg button{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 16px;font:600 13px var(--body);cursor:pointer}.wseg button+button{border-left:0}.wseg button.on{background:var(--ink);color:var(--surface)}
.wcg{display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr));border:1px solid var(--ink);background:var(--surface)}
.wcg.stk .wch{position:sticky;top:0;z-index:6}
.wch{background:var(--surface);border-bottom:2px solid var(--ink)}
.wch.t{border-right:1px solid var(--line)}
.wch.d{border-left:1px solid var(--line);padding:4px 4px 5px;min-width:0;cursor:pointer}
.wch .dn{display:flex;align-items:baseline;gap:5px;font:700 12px var(--body);letter-spacing:.06em;color:var(--muted)}.wch .dn b{font:800 20px var(--body);color:var(--ink);letter-spacing:0}
.wch.td .dn,.wch.td .dn b{color:var(--red)}
.wch .tp{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.35;min-width:0}.wch .tp i{flex:none;width:7px;height:7px;border-radius:50%}.wch .tp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.wch .tp.dn2 span{text-decoration:line-through;opacity:.55}.wch .tp.em{color:var(--muted);font-style:italic}.wch .tp svg{width:14px;height:11px;flex:none}
.wct{position:relative;border-right:1px solid var(--line)}.wct span{position:absolute;right:4px;font-size:10px;color:var(--muted);transform:translateY(-6px)}.wct span:first-child{transform:none;top:2px!important}
.wcc{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--soft) 1px,transparent 1px);background-size:100% calc(var(--wrh)*2)}
.wcc.td{background-color:rgba(190,60,50,.05)}
.wcb{position:absolute;overflow:hidden;font-size:11px;line-height:1.15;padding:2px 3px 2px 5px;border:0;border-left:4px solid var(--muted);background:var(--surface);box-shadow:0 0 0 1px var(--line) inset;color:var(--ink);cursor:pointer;text-align:left;font-weight:600}
.wcb.L{border-left-color:var(--blue)}.wcb.F{border-left-color:var(--green)}.wcb.P{border-left-color:var(--red)}
.wcb.top{color:#fff;box-shadow:none}.wcb.top.L{background:var(--blue)}.wcb.top.F{background:var(--green)}.wcb.top.P{background:var(--red)}
.wcb.fixed{background:repeating-linear-gradient(135deg,var(--soft) 0,var(--soft) 4px,var(--soft2) 4px,var(--soft2) 8px)}
.wcb.clash{outline:2px solid var(--amber);outline-offset:-2px}
.wcb.dn{opacity:.55}.wcb.dn .tt{text-decoration:line-through}
.wcb .tm{display:block;font-weight:400;font-size:10px;opacity:.85}.wcb .fr2{position:absolute;right:2px;top:2px;display:inline-flex;background:var(--surface);border-radius:3px;padding:1px 2px}.wcb .fr2 svg{width:14px;height:11px}
.wcb{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wcb.hascb{padding-left:21px}.wcb .cb{position:absolute;left:3px;top:3px;width:14px;height:14px;border-color:currentColor}
.wcb.top .cb.d{background:#fff}.wcb.top .cb.p{background:linear-gradient(135deg,#fff 50%,transparent 50%)}
.wcb.top.L .cb.d::before{color:var(--blue)}.wcb.top.F .cb.d::before{color:var(--green)}.wcb.top.P .cb.d::before{color:var(--red)}
.wcb .rz{position:absolute;left:0;right:0;bottom:0;height:min(10px,40%);cursor:ns-resize;touch-action:none;z-index:2}
.wcb .rz::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.4}
.wcb.dragging{box-shadow:0 5px 16px rgba(0,0,0,.38);z-index:10;opacity:.93;cursor:grabbing}
.wcc{cursor:cell}.wcb{cursor:grab}
.wcn{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:4;pointer-events:none}
.hrs.blk2{justify-content:flex-start;padding:2px 0 8px}
.todayrow{flex:0 0 100%;display:flex;justify-content:center}.todayrow:has(button[hidden]){display:none}
.todayrow .nav.goto{font-size:17px;padding:9px 26px;min-height:44px}
.datebox input[type=date]{background:transparent;border:1px solid var(--line);padding:4px 6px;font-weight:600;font-size:15px}
.nav{border:1px solid var(--line);background:transparent;padding:4px 9px}
.dwrap{position:relative;flex:1;min-width:0;display:flex}
.nav .arr{font-size:26px;line-height:.8;font-weight:900;vertical-align:-3px}
.plab{font-size:16px;padding:4px 7px;border:1px solid transparent;white-space:nowrap}
.plab.cur{background:var(--blue);color:var(--bg);border-color:var(--blue);font-weight:800}
.selbox{width:20px;height:20px;border:2px solid var(--ink);flex:none;display:inline-flex;align-items:center;justify-content:center;margin-right:2px}
.selbox.on{background:var(--ink)}.selbox.on::before{content:"\2713";color:var(--surface);font:700 14px/1 var(--body)}
.selbar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.selbar .btn{padding:8px 14px}
.sublist{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.subr{display:flex;align-items:center;gap:10px;min-height:34px;border-bottom:1px solid var(--soft)}
.subc{width:20px;height:20px;border:2px solid var(--ink);background:transparent;flex:none;padding:0;display:inline-flex;align-items:center;justify-content:center}

  Object.keys(st.days).forEach(function(k){var dy=st.days[k];if(!dy||!dy.tops||!dy.blocks)return;
    AK.forEach(function(a){var tid=dy.tops[a];if(!tid||tid==='empty')return;var T=item(tid);if(!T)return;
      if(dy.blocks.some(function(b){return b.ref===tid}))return;
      var b=dy.blocks.filter(function(x){return x.kind==='flex'&&!x.rid&&x.ref!==tid&&sameTitle(x.title,T.text)})[0];
      if(!b)return;
      var D=b.ref&&item(b.ref);
      if(D){
        if(D.status==='top'||D.pr==='A'&&D.area!==T.area)return;
        if(itemUsedElsewhere(D.id,b))return;
        if(D.st&&!T.st)T.st=D.st;
        st.dump=st.dump.filter(function(x){return x!==D});
        dy.prog=(dy.prog||[]).filter(function(x){return x!==D.id});
      }
      b.ref=tid;b.st='';
    });
  });
}

function genC(r,from,to){

  for(p=0;p<6000;p++){
    var c=[],first;

    else if(r.fq==='w'){var mon=addDays(r.start,-((sdw+6)%7)),wk=addDays(mon,7*iv*p);first=wk;WDO.forEach(function(w){if((r.wd||[]).indexOf(w)>=0)c.push(addDays(wk,(w+6)%7))})}
    else if(r.fq==='m'){

      if(r.mm==='nth'){var nn=nthOf(r.start),dd;

      if(d>=from)out.push(d)}
  }

}

function recNth(r,k,prev){

function occDates(r,from,to){

}

  var fut={},past={},frogs={};
  Object.keys(st.days).forEach(function(k){
    var dy=st.days[k];if(!dy)return;var tg=k>=today?fut:past,ids=[];
    (dy.prog||[]).forEach(function(x){ids.push(x)});
    AK.forEach(function(a){var v=dy.tops&&dy.tops[a];if(v&&v!=='empty'){ids.push(v);if(dy.frog===a&&k<today)frogs[v]=1}});
    (dy.blocks||[]).forEach(function(b){if(b.ref)ids.push(b.ref)});
    (dy.deleg||[]).forEach(function(x){ids.push(x.id)});
    ids.forEach(function(id){tg[id]=1})});
  var n=0;
  st.dump.forEach(function(i){
    if(i.st==='d'||(i.status!=='prog'&&i.status!=='top')||fut[i.id]||!past[i.id])return;
    if(frogs[i.id])i.slips=(i.slips||0)+1;

    if(b.rid&&b.ref){var oi=item(b.ref);if(oi&&(oi.rid||(oi.status==='prog'&&!oi.pr&&!oi.due&&sameTitle(oi.text,b.title)))){b.st=oi.st||'';b.ref='';

      b.ref=nid;b.st='';if(!dy.prog)dy.prog=[];if(dy.prog.indexOf(nid)<0)dy.prog.push(nid)}})});

  zoomV=Math.max(.7,Math.min(2.6,z));var rh=rowBase()*zoomV;document.documentElement.style.setProperty('--rh',rh+'px');

(function(){

  document.addEventListener('touchstart',function(e){var z=document.getElementById('sched');if(!z||e.touches.length!==2||!z.contains(e.target)&&!z.contains(e.touches[0].target))return;if(ui.mode!=='plan')return;d0=dist(e.touches);z0=zoomF();on=true},{passive:true});
  document.addEventListener('touchmove',function(e){if(!on||e.touches.length!==2)return;e.preventDefault();var z=z0*dist(e.touches)/d0;if(raf)return;raf=requestAnimationFrame(function(){raf=0;zoomApply(z)})},{passive:false});
  document.addEventListener('touchend',function(e){if(on&&e.touches.length<2){on=false;try{localStorage.setItem('timebox-zoom',String(zoomV))}catch(x){}}});
  document.addEventListener('gesturestart',function(e){if(ui.mode==='plan'&&document.getElementById('sched')&&document.getElementById('sched').contains(e.target))e.preventDefault()});
})();

/* linea dell'ora corrente (stile Calendario Apple) e posizionamento all'apertura di Pianifica */

function snapSched(){
  var host=document.getElementById('sched');if(!host||host.offsetParent===null)return;
  var el=document.getElementById('nowline'),y;
  if(el&&el.style.display!=='none')y=el.getBoundingClientRect().top+window.pageYOffset-window.innerHeight*0.33;
  else{
    var rh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh'))||22,bl=day().blocks,mn=bl.length?Math.min.apply(null,bl.map(function(b){return b.s})):6;
    y=host.getBoundingClientRect().top+window.pageYOffset+Math.max(0,mn-2)*rh-90;
  }

function fitBlocks(){
  var els=document.querySelectorAll('#sched .blk');
  [].forEach.call(els,function(el){
    var sm=el.querySelector('.sm'),x=el.querySelector('.x'),fixed=el.classList.contains('fixed');
    el.style.fontSize='';el.style.paddingLeft='';el.style.paddingRight='';el.style.paddingTop='';el.style.paddingBottom='';el.style.lineHeight='';
    if(sm){sm.style.display='';sm.style.fontSize=''}
    if(x)x.style.padding='';
    el.classList.remove('narrow','vn');el.classList.toggle('one',el.clientHeight<50);
    if(!el.clientWidth)return;
    var vn=el.clientWidth<150;
    if(el.clientWidth<210){el.classList.add('narrow');el.style.paddingLeft=fixed||vn?'7px':'30px';el.style.paddingRight=vn?'7px':'20px';if(x)x.style.padding='4px 5px'}
    if(vn)el.classList.add('vn');
    el.style.paddingTop=vn?'30px':(el.clientWidth<210&&el.classList.contains('top')?'20px':'1px');el.style.paddingBottom='1px';el.style.lineHeight='1.12';
    if(el.classList.contains('one')){el.style.paddingLeft='30px';el.style.paddingRight=vn?'6px':'20px';el.style.paddingTop='1px'}
    function over(){return el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1}
    function set(fs){el.style.fontSize=fs+'px';if(sm)sm.style.fontSize=(fs*0.9)+'px'}
    function best(){var lo=el.classList.contains('one')?7:el.classList.contains('narrow')?12:8,hi=17,ok=false;set(lo);if(over())return false;for(var k=0;k<7;k++){var mid=(lo+hi)/2;set(mid);if(over())hi=mid;else{lo=mid;ok=true}}set(lo);return true}
    if(!best()&&sm){sm.style.display='none';best()}
  });
}

function removeFromDay(d,id){
  AK.forEach(function(a){if(d.tops[a]===id){d.tops[a]=null;if(d.frog===a)d.frog=null}});
  d.blocks=d.blocks.filter(function(b){return b.ref!==id});
  d.prog=d.prog.filter(function(x){return x!==id});
  d.deleg=d.deleg.filter(function(x){return x.id!==id});

function release(id){var d=day(),i=item(id);removeFromDay(d,id);if(i)i.status='open'}

  var d=day(),i=item(id);if(!i)return;
  removeFromDay(d,id);

function placeSlots(d,n,pref){
  var tries=[pref],k;for(k=pref+1;k<=NSLOT-n;k++)tries.push(k);for(k=0;k<pref;k++)tries.push(k);
  for(var t=0;t<tries.length;t++){

    var c={s:s,n:n};

  }
  return -1;
}

  document.addEventListener('click',function(e){if(Date.now()-sup<450){e.stopPropagation();e.preventDefault()}},true);
  function slotAt(y,x){
    var z=document.getElementById('sched');if(!z||z.offsetParent===null)return -1;
    var r=z.getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)return -1;
    var row=z.querySelector('.srow'),rh=row?row.offsetHeight:22,k=Math.floor((y-r.top)/rh);
    return Math.max(0,Math.min(NSLOT-2,k-(k>0?0:0)));
  }
  function mark(k){
    var z=document.getElementById('sched');if(!z)return;
    if(!mk||!mk.parentNode){mk=document.createElement('div');mk.className='dmark';z.appendChild(mk)}
    if(k<0){mk.style.display='none';return}
    var row=z.querySelector('.srow'),rh=row?row.offsetHeight:22;
    mk.style.display='';mk.style.top=(k*rh)+'px';mk.style.height=(2*rh)+'px';
    mk.textContent=slotLab(k)+'–'+slotLab(k+2);
  }
  function begin(){
    if(!dd||dd.on)return;dd.on=true;
    var g=document.createElement('div');g.className='dgh';g.textContent=dd.text;document.body.appendChild(g);dd.g=g;
    dd.el.classList.add('dragging');document.body.classList.add('ddrag');
    try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
    place();loop();
  }
  function place(){if(!dd||!dd.g)return;dd.g.style.left=(lastX+12)+'px';dd.g.style.top=(lastY-18)+'px';mark(slotAt(lastY,lastX))}
  function loop(){
    if(!dd||!dd.on)return;
    var h=window.innerHeight,dy=0;
    if(lastY<90)dy=-Math.ceil((90-lastY)/6);else if(lastY>h-90)dy=Math.ceil((lastY-(h-90))/6);
    if(dy){window.scrollBy(0,dy);place()}
    raf=requestAnimationFrame(loop);
  }
  function stop(){
    cancelAnimationFrame(raf);
    if(dd){clearTimeout(dd.timer);if(dd.g&&dd.g.parentNode)dd.g.parentNode.removeChild(dd.g);dd.el&&dd.el.classList.remove('dragging')}
    if(mk&&mk.parentNode)mk.parentNode.removeChild(mk);mk=null;
    document.body.classList.remove('ddrag');
  }
  document.addEventListener('pointerdown',function(e){
    if(ui.mode!=='plan'||ui.sel.on||ui.sheet)return;
    var el=e.target.closest&&e.target.closest('#dump .sw .it');if(!el||e.target.closest('.dcb,.swdel'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var id=el.getAttribute('data-id'),it=item(id);if(!it)return;
    lastX=e.clientX;lastY=e.clientY;
    dd={el:el,id:id,text:it.text,x0:e.clientX,y0:e.clientY,on:false,touch:e.pointerType!=='mouse',timer:0};
    if(dd.touch)dd.timer=setTimeout(begin,380);
  },true);
  document.addEventListener('pointermove',function(e){
    if(!dd)return;lastX=e.clientX;lastY=e.clientY;
    if(!dd.on){
      var d=Math.max(Math.abs(e.clientX-dd.x0),Math.abs(e.clientY-dd.y0));
      if(dd.touch){if(d>9){clearTimeout(dd.timer);dd=null}return}
      if(d>6)begin();else return;
    }
    place();
  },true);
  document.addEventListener('touchmove',function(e){if(dd&&dd.on)e.preventDefault()},{passive:false});
  function end(e){
    if(!dd)return;var x=dd;
    if(!x.on){clearTimeout(x.timer);dd=null;return}
    var k=e.type==='pointercancel'?-1:slotAt(e.clientY,e.clientX);
    stop();dd=null;sup=Date.now();
    if(k<0){render();return}
    var it=item(x.id);if(!it){render();return}
    var err=scheduleItem(it,st.date,k,2,'flex');
    if(err){ui.sheet={mode:'new',date:st.date,s:k,n:2,kind:'flex',title:'',area:'',pr:'',src:it.id,rep:'',rend:'n',rdate:'',rcount:10,err:err}}
    else toast('«'+it.text+'» alle '+slotLab(k)+', 1 h');
    render();
  }
  document.addEventListener('pointerup',end,true);
  document.addEventListener('pointercancel',end,true);
})();

  if(c==='server_not_connected'||c==='needs_reauth'||c==='selection_required')return 'collega o ricollega Google Drive tra i connettori di Claude, poi riprova.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'accesso a Drive non autorizzato. Tocca "Collega Google Drive" e consenti l\'accesso.';
  if(c==='blocked_by_policy')return 'il tuo account non consente l\'accesso a Drive da qui.';
  if(c==='server_unavailable'||c==='upstream_error')return 'Drive non risponde, riprovo al prossimo salvataggio.';
  return (e&&e.message)?String(e.message).slice(0,140):'errore sconosciuto.';

/* Aggiornamento automatico: confronta la versione online con quella in uso */
(function(){
  if(!/^https?:/.test(location.protocol))return;
  var mine=(document.querySelector('meta[name="tb-build"]')||{}).content;
  if(!mine)return;
  var busy=false;
  function check(){
    if(busy||!navigator.onLine)return;busy=true;
    fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      var m=t.match(/name="tb-build" content="([^"]+)"/);
      if(m&&m[1]!==mine){
        var open=document.querySelector('.sheet,.ov');
        if(!open)location.reload();
      }
    }).catch(function(){}).then(function(){busy=false});
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
  window.addEventListener('pageshow',check);
  setTimeout(check,2000);
})();
